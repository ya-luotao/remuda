[package]
name = "remuda"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Multi-account and session manager TUI for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ya-luotao/remuda"
homepage = "https://github.com/ya-luotao/remuda"
readme = "README.md"
keywords = ["claude", "codex", "tui", "sessions", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
jiff = "0.2.37"
libc = "0.2.189"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml_edit = "0.25.15"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
