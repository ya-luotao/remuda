name: Bug report
description: Report behavior that is wrong, surprising, or contradicts SPEC.md.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please do not include credentials, email addresses, or
        other personal data; redact paths and session contents where needed.
        Security vulnerabilities must be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did remuda do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead? If SPEC.md describes it, cite the entry (for example R6).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the keys you pressed, and the relevant part of config.toml (redacted).
      placeholder: |
        1. remuda add work ~/.claude-work
        2. remuda run work
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages or other relevant output.
      render: text
  - type: input
    id: remuda-version
    attributes:
      label: remuda version
      description: Output of `remuda --version`, or the commit if built from source.
    validations:
      required: true
  - type: input
    id: agent-versions
    attributes:
      label: Agent versions
      description: Output of `claude --version` and, if relevant, `codex --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and terminal emulator for TUI issues.
      placeholder: macOS 15.5, iTerm2 3.5
    validations:
      required: true
